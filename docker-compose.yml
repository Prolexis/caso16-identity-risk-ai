services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caso16
      POSTGRES_USER: caso16
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - caso16_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caso16 -d caso16"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg2://caso16:${POSTGRES_PASSWORD}@db:5432/caso16
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CASO16_SECRET_KEY: ${CASO16_SECRET_KEY:?Configure CASO16_SECRET_KEY}
      CASO16_API_URL: http://api:8000/api/v1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
  api:
    build: .
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg2://caso16:${POSTGRES_PASSWORD}@db:5432/caso16
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CASO16_SECRET_KEY: ${CASO16_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
volumes:
  caso16_pgdata:
